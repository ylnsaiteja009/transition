<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokesh</title>
    <style>
    * {
        padding: 0px;
        margin: 0px;
        box-sizing: border-box;
    }

    body {
        background-color: #ffffff;
    }

    .class1 {
        height: 170px;
        width: 160px;
        position: absolute;
        top: 37px;
        left: 250px;
        transform: rotate(40deg);
        border-radius: 7px;
        box-shadow: 3px 5px 3px rgb(134, 12, 12);
        overflow: hidden;
    }

    .class2 {
        height: 190px;
        width: 180px;
        position: absolute;
        top: 150px;
        left: 380px;
        transform: rotate(40deg);
        border-radius: 7px;
        box-shadow: 3px 5px 3px rgb(222, 38, 38);
        overflow: hidden;
    }

    .class3 {
        height: 150px;
        width: 170px;
        position: absolute;
        top: 20px;
        left: 510px;
        transform: rotate(40deg);
        border-radius: 7px;
        box-shadow: 3px 5px 3px rgb(249, 69, 69);
        overflow: hidden;
    }

    .class4 {
        height: 180px;
        width: 180px;
        position: absolute;
        top: 300px;
        left: 510px;
        transform: rotate(40deg);
        border-radius: 7px;
        box-shadow: 3px 5px 3px rgb(200, 32, 32);
        overflow: hidden;
    }

    .class5 {
        height: 180px;
        width: 180px;
        position: absolute;
        top: 300px;
        left: 240px;
        transform: rotate(40deg);
        border-radius: 7px;
        box-shadow: 3px 5px 3px rgb(218, 45, 45);
        overflow: hidden;
    }

    img {
        height: 140%;
        width: 140%;
        position: relative;
        top: -20%;
        left: -20%;
        border-radius: 7px;
        object-fit: cover;
        transform: rotate(-40deg);
        transition: 0.5s;
    }

    img:hover {
        transform: rotate(-40deg) scale(1.2);
    }

    </style>
</head>

<body>

    <div class="class1">
        <img src="./diamond head.jpg">
    </div>

    <div class="class2">
        <img src="./ben 10.jpg">
    </div>

    <div class="class3">
        <img src="./ben 10 2.jpg">
    </div>

    <div class="class4">
        <img src="./four arms.webp">
    </div>

    <div class="class5">
        <img src="./diamond head.jpg">
    </div>

    <div class="class5">
        <img src="./headblast.jpg">
    </div>
    
</body>
</html>
